<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="gridGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".1"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></linearGradient><style>@keyframes float{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-10px) rotate(1deg)}}@keyframes pulse{0%{opacity:.2}50%{opacity:.6}}@keyframes scan{0%{y:20px}50%{y:260px}}.badge,.subtitle,.title{font-family:&apos;Segoe UI&apos;,system-ui,-apple-system,sans-serif}.title{font-weight:800;font-size:56px;fill:url(#titleGrad)}.subtitle{font-weight:500;font-size:22px;fill:#94a3b8}.badge{font-weight:600;font-size:14px;fill:#38bdf8}.animated-bg-box{animation:float 6s ease-in-out infinite;opacity:.25}.animated-pulse{animation:pulse 4s ease-in-out infinite}.scan-line{animation:scan 8s ease-in-out infinite;opacity:.4}</style></defs><rect width="1200" height="300" fill="url(#bgGrad)" rx="16"/><g stroke="#38bdf8" stroke-dasharray="4 4" stroke-width="1" class="animated-pulse" opacity=".2"><line x1="100" x2="100" y1="0" y2="300"/><line x1="300" x2="300" y1="0" y2="300"/><line x1="500" x2="500" y1="0" y2="300"/><line x1="700" x2="700" y1="0" y2="300"/><line x1="900" x2="900" y1="0" y2="300"/><line x1="1100" x2="1100" y1="0" y2="300"/></g><g class="animated-bg-box"><rect width="180" height="120" x="70" y="40" fill="none" stroke="#38bdf8" stroke-dasharray="6 6" stroke-width="2" rx="8"/><circle cx="70" cy="40" r="4" fill="#38bdf8"/><circle cx="250" cy="40" r="4" fill="#38