<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 56px; fill: url(#titleGrad); }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 22px; fill: #94a3b8; }
      .badge { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
      
      @keyframes float {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes pulse {
        0% { opacity: 0.2; }
        50% { opacity: 0.6; }
        100% { opacity: 0.2; }
      }
      @keyframes scan {
        0% { y: 20px; }
        50% { y: 260px; }
        100% { y: 20px; }
      }
      
      .animated-bg-box { animation: float 6s ease-in-out infinite; opacity: 0.25; }
      .animated-pulse { animation: pulse 4s ease-in-out infinite; }
      .scan-line { animation: scan 8s ease-in-out infinite; opacity: 0.4; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Lines (Dynamic/Background) -->
  <g class="animated-pulse" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" opacity="0.2">
    <line x1="100" y1="0" x2="100" y2="300" />
    <line x1="300" y1="0" x2="300" y2="300" />
    <line x1="500" y1="0" x2="500" y2="300" />
    <line x1="700" y1="0" x2="700" y2="300" />
    <line x1="900" y1="0" x2="900" y2="300" />
    <line x1="1100" y1="0" x2="1100" y2="300" />
  </g>

  <!-- Bounding Box Graphics (Behind Text) -->
  <g class="animated-bg-box">
    <!-- Camera Target / Bounding Box 1 -->
    <rect x="70" y="40" width="180" height="120" rx="8" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6" />
    <circle cx="70" cy="40" r="4" fill="#38bdf8" />
    <circle cx="250" cy="40" r="4" fill="#38bdf8" />
    <circle cx="70" cy="160" r="4" fill="#38bdf8" />
    <circle cx="250" cy="160" r="4" fill="#38bdf8" />
  </g>
  
  <g class="animated-bg-box" style="animation-delay: -3s;">
    <!-- Bounding Box 2 -->
    <rect x="950" y="140" width="180" height="110" rx="8" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="6 6" />
    <circle cx="950" cy="140" r="4" fill="#c084fc" />
    <circle cx="1130" cy="140" r="4" fill="#c084fc" />
    <circle cx="950" cy="250" r="4" fill="#c084fc" />
    <circle cx="1130" cy="250" r="4" fill="#c084fc" />
  </g>

  <!-- Scanning laser line in background -->
  <rect class="scan-line" x="0" y="20" width="1200" height="2" fill="url(#titleGrad)" />

  <!-- Main Content (Foreground - Clear & High Contrast) -->
  <g transform="translate(600, 125)" text-anchor="middle">
    <!-- Category Badge -->
    <rect x="-140" y="-75" width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text y="-54" class="badge" text-anchor="middle">👁️ AWESOME COMPUTER VISION</text>
    
    <!-- Title -->
    <text y="15" class="title">Awesome-Computer-Vision-API</text>
    
    <!-- Subtitle -->
    <text y="60" class="subtitle">A Curated List of SaaS Platforms &amp; Open-Source Computer Vision APIs</text>
  </g>
</svg>
